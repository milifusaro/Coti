name: Chequear arbitraje dolar Uala/Fiwind

on:
  schedule:
    # Corre cada 5 minutos. Los horarios de GitHub Actions son en UTC.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permite tambien correrlo a mano desde la pestaña "Actions"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar chequeo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THRESHOLD_ARS: "4.0"
        run: python check_arbitrage.py
