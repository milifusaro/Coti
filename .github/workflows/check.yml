name: Chequear arbitraje dolar Uala/Fiwind

on:
  schedule:
    # Hora de Argentina (UTC-3): todos los dias de 7:00 a 23:00.
    # GitHub usa UTC, por eso 07:00-23:00 ART = 10:00-02:00 UTC.
    # Minutos 3, 8, 13... para evitar los minutos mas congestionados de GitHub.
    - cron: "3-58/5 10-23 * * *"   # 07:03 a 20:58 ART
    - cron: "3-58/5 0-1 * * *"     # 21:03 a 22:58 ART
    - cron: "3 2 * * *"            # 23:03 ART
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar chequeo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THRESHOLD_ARS_1: "4.0"
          THRESHOLD_ARS_2: "4.0"
          AJUSTE_SUPERVIELLE: "10.0"
        run: python check_arbitrage.py
