name: Chequear arbitraje dolar Uala/Fiwind

on:
  schedule:
    # Hora de Argentina (UTC-3): todos los dias de 7:00 a 23:00, cada 5 minutos.
    # GitHub usa UTC, por eso 07:00-23:00 ART = 10:00-02:00 UTC.
    - cron: "*/5 10-23 * * *"   # 07:00 a 20:55 ART
    - cron: "*/5 0-1 * * *"     # 21:00 a 22:55 ART
    - cron: "0 2 * * *"         # 23:00 ART
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar chequeo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THRESHOLD_ARS_1: "4.0"
          THRESHOLD_ARS_2: "4.0"
          AJUSTE_SUPERVIELLE: "10.0"
        run: python check_arbitrage.py
